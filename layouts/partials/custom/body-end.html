<!-- Google AdSense - Display Ad Units -->

<!-- Sidebar Ad Unit (if theme supports sidebar) -->
<div class="adsense-sidebar" style="margin: 20px 0;">
  <ins class="adsbygoogle"
       style="display:block"
       data-ad-client="ca-pub-9493926885795453"
       data-ad-slot="auto"
       data-ad-format="auto"
       data-full-width-responsive="true"></ins>
  <script>
       (adsbygoogle = window.adsbygoogle || []).push({});
  </script>
</div>

<!-- In-Article Ad Unit -->
<div class="adsense-in-article" style="margin: 30px 0; text-align: center;">
  <ins class="adsbygoogle"
       style="display:block; text-align:center;"
       data-ad-layout="in-article"
       data-ad-format="fluid"
       data-ad-client="ca-pub-9493926885795453"
       data-ad-slot="auto"></ins>
  <script>
       (adsbygoogle = window.adsbygoogle || []).push({});
  </script>
</div>
